<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <rect width="1280" height="860" fill="#f6f7f9"/>
  <text x="48" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#12141a">Architect 2.0</text>
  <text x="48" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6472">One project is the source of truth. Soft and Pro are two views of it.</text>

  <rect x="48" y="104" width="560" height="72" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="72" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">Soft lane</text>
  <text x="72" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Prompt, plan, flow, preview, chat</text>

  <rect x="672" y="104" width="560" height="72" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="696" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">Pro lane</text>
  <text x="696" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Same project, plus files, framework, GitHub, deploy</text>

  <line x1="328" y1="176" x2="328" y2="198" stroke="#157a45" stroke-width="2"/>
  <line x1="952" y1="176" x2="952" y2="198" stroke="#157a45" stroke-width="2"/>
  <line x1="328" y1="198" x2="952" y2="198" stroke="#157a45" stroke-width="2"/>
  <line x1="640" y1="198" x2="640" y2="214" stroke="#157a45" stroke-width="2"/>

  <rect x="48" y="214" width="1184" height="86" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="72" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">BROWSER</text>
  <text x="72" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">Studio UI</text>
  <text x="168" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6472">Next.js App Router. React. The person never sees API keys.</text>
  <text x="72" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Prompt, plan, flow canvas, agent canvas, files, knowledge, data, activity, chat</text>

  <line x1="640" y1="300" x2="640" y2="328" stroke="#157a45" stroke-width="2"/>

  <rect x="48" y="328" width="1184" height="150" rx="12" fill="#e7f6ee" stroke="#157a45"/>
  <text x="72" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">PROXY - VERCEL SERVER</text>
  <text x="72" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">Next.js route handlers are the only callers of OpenAI and GitHub</text>

  <rect x="72" y="398" width="210" height="58" rx="8" fill="#ffffff" stroke="#b7e4c7"/>
  <text x="88" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12141a">Auth</text>
  <text x="88" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">JWT cookie, bcrypt</text>

  <rect x="298" y="398" width="210" height="58" rx="8" fill="#ffffff" stroke="#b7e4c7"/>
  <text x="314" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12141a">Projects</text>
  <text x="314" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Build, chat, files</text>

  <rect x="524" y="398" width="210" height="58" rx="8" fill="#ffffff" stroke="#b7e4c7"/>
  <text x="540" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12141a">Model adapter</text>
  <text x="540" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">one complete() call</text>

  <rect x="750" y="398" width="210" height="58" rx="8" fill="#ffffff" stroke="#b7e4c7"/>
  <text x="766" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12141a">GitHub adapter</text>
  <text x="766" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">OAuth, encrypted token</text>

  <rect x="976" y="398" width="220" height="58" rx="8" fill="#ffffff" stroke="#b7e4c7"/>
  <text x="992" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#12141a">Publish</text>
  <text x="992" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">/a/slug HTML snapshot</text>

  <line x1="200" y1="478" x2="200" y2="512" stroke="#157a45" stroke-width="2"/>
  <line x1="500" y1="478" x2="500" y2="512" stroke="#157a45" stroke-width="2"/>
  <line x1="800" y1="478" x2="800" y2="512" stroke="#157a45" stroke-width="2"/>
  <line x1="1080" y1="478" x2="1080" y2="512" stroke="#157a45" stroke-width="2"/>

  <rect x="48" y="512" width="270" height="110" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="68" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">DATA</text>
  <text x="68" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">Neon Postgres</text>
  <text x="68" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">users, projects, records</text>

  <rect x="342" y="512" width="300" height="110" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="362" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">MODEL</text>
  <text x="362" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">OpenAI gpt-4o-mini</text>
  <text x="362" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">If it fails, a local template builds</text>

  <rect x="666" y="512" width="270" height="110" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="686" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">GITHUB</text>
  <text x="686" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">GitHub API</text>
  <text x="686" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Create repo, commit a tree</text>

  <rect x="960" y="512" width="272" height="110" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="980" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">SANDBOX</text>
  <text x="980" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#12141a">iframe sandbox</text>
  <text x="980" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Preview and published HTML</text>

  <rect x="48" y="650" width="1184" height="92" rx="12" fill="#ffffff" stroke="#d8dde6"/>
  <text x="72" y="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#157a45">AGENT HARNESS - stored on the project</text>
  <text x="72" y="712" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12141a">Prompt, then Plan, then Flow and agent graph, then Build, then Preview, files, chat, traces</text>

  <text x="48" y="782" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Live: architect-2-kohl.vercel.app. The generated page runs in the sandbox. Framework source is exported, not a second runtime.</text>
  <text x="48" y="808" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Deploy is a Postgres snapshot on the same Vercel app. There is no container per generated app.</text>
</svg>

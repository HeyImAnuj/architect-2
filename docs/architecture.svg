<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240">
  <rect width="1680" height="1240" fill="#f4f6f8"/>
  <text x="40" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#12141a">Architect 2.0 live architecture</text>
  <text x="40" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6472">Two kinds of people. One project. Real agents run on the server. Soft ships the app. Pro can also take the source.</text>

  <rect x="32" y="98" width="792" height="292" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="52" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">SOFT USER</text>
  <text x="148" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Non-technical. Stays in language. Publishes without GitHub.</text>

  <rect x="52" y="148" width="170" height="100" rx="10" fill="#f7faf8" stroke="#b7e4c7"/>
  <text x="66" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">1. Sign in</text>
  <text x="66" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Name, email, or guest.</text>
  <text x="66" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Session stays on the server.</text>
  <text x="66" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">No API keys in the browser.</text>

  <rect x="246" y="148" width="170" height="100" rx="10" fill="#f7faf8" stroke="#b7e4c7"/>
  <text x="260" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">2. Describe</text>
  <text x="260" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">One prompt for the job.</text>
  <text x="260" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Lane stays Soft.</text>
  <text x="260" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Optional file as knowledge.</text>

  <rect x="440" y="148" width="170" height="100" rx="10" fill="#f7faf8" stroke="#b7e4c7"/>
  <text x="454" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">3. Shape</text>
  <text x="454" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Answer who may decide.</text>
  <text x="454" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Draw the flow.</text>
  <text x="454" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Chat to change the app.</text>

  <rect x="634" y="148" width="170" height="100" rx="10" fill="#e7f6ee" stroke="#157a45"/>
  <text x="648" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">4. Deploy</text>
  <text x="648" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Use the preview.</text>
  <text x="648" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Press Deploy. Ship now.</text>
  <text x="648" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Share the public link.</text>

  <text x="52" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">What they see: a working app, then a link. They never open source, a framework, or GitHub.</text>
  <text x="52" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Guardrail from the plan: advice only, wait for approval, or act inside rules. Sensitive steps stop for a person.</text>
  <text x="52" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#157a45">Their result comes back up from the sandbox as the preview and the /a/ link.</text>

  <rect x="856" y="98" width="792" height="292" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="876" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">PRO USER</text>
  <text x="968" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Engineer. Same project, plus source, traces, and GitHub.</text>

  <rect x="876" y="148" width="170" height="100" rx="10" fill="#f7f8fb" stroke="#d5dbe3"/>
  <text x="890" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">1. Sign in</text>
  <text x="890" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Same account system.</text>
  <text x="890" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Can open a Soft project.</text>
  <text x="890" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Switch the lane to Pro.</text>

  <rect x="1070" y="148" width="170" height="100" rx="10" fill="#f7f8fb" stroke="#d5dbe3"/>
  <text x="1084" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">2. Framework</text>
  <text x="1084" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Same prompt and plan.</text>
  <text x="1084" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Pick Lyzr, CrewAI,</text>
  <text x="1084" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">LangGraph, AutoGen, or custom.</text>

  <rect x="1264" y="148" width="170" height="100" rx="10" fill="#f7f8fb" stroke="#d5dbe3"/>
  <text x="1278" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">3. Inspect</text>
  <text x="1278" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Agent graph and files.</text>
  <text x="1278" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Activity shows each run.</text>
  <text x="1278" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Edit a file and save.</text>

  <rect x="1458" y="148" width="170" height="100" rx="10" fill="#e7f6ee" stroke="#157a45"/>
  <text x="1472" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#12141a">4. Ship</text>
  <text x="1472" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Same Deploy as Soft.</text>
  <text x="1472" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Or push the source.</text>
  <text x="1472" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">GitHub is optional.</text>

  <text x="876" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">What they see: the same app Soft shipped, plus the agent graph, the files, and the trace of each agent.</text>
  <text x="876" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">They can take over a project a Soft user started. Deploy does not wait for a repository.</text>
  <text x="876" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#157a45">Files and the GitHub repo are a second door on the same project, not a second app.</text>

  <line x1="420" y1="390" x2="420" y2="418" stroke="#157a45" stroke-width="2"/>
  <line x1="1260" y1="390" x2="1260" y2="418" stroke="#157a45" stroke-width="2"/>
  <line x1="420" y1="418" x2="1260" y2="418" stroke="#157a45" stroke-width="2"/>
  <line x1="840" y1="418" x2="840" y2="446" stroke="#157a45" stroke-width="2"/>

  <rect x="32" y="446" width="1616" height="118" rx="14" fill="#12141a"/>
  <text x="52" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#8ee0b0">ONE PROJECT IN POSTGRES</text>
  <text x="52" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">This row is the source of truth for both users. Agents read it. Deploy publishes it. GitHub exports it.</text>
  <text x="52" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c5ced8">prompt  |  plan and skill  |  flow graph  |  agent graph  |  knowledge  |  data records  |  preview  |  files  |  traces</text>

  <line x1="840" y1="564" x2="840" y2="592" stroke="#157a45" stroke-width="2"/>

  <text x="32" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">AGENT RUNTIME</text>
  <text x="170" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">When a live user presses Build, the server runs the graph. The browser only sends the instruction and receives the app.</text>

  <rect x="32" y="640" width="390" height="230" rx="14" fill="#ffffff" stroke="#157a45"/>
  <text x="52" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">1. HARNESS</text>
  <text x="52" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#12141a">Walks the flow the person drew</text>
  <text x="52" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Each flow step calls the agent on that node.</text>
  <text x="52" y="748" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Edges say what happens next, including a handoff.</text>
  <text x="52" y="770" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Approval plans pause until a person says yes.</text>
  <text x="52" y="792" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Every call is written to Activity as a trace.</text>
  <text x="52" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Tech: flow, agents, edges, and traces in Postgres.</text>
  <text x="52" y="844" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">The plan skill is the rule every agent must follow.</text>

  <rect x="440" y="640" width="390" height="230" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="460" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">2. MODEL PROXY</text>
  <text x="460" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#12141a">One server function calls the model</text>
  <text x="460" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">The browser never holds the provider key.</text>
  <text x="460" y="748" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Each agent card stores its own model name.</text>
  <text x="460" y="770" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Framework id chooses the source shape, not a second host.</text>
  <text x="460" y="792" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">If the provider fails, a template still returns a usable app.</text>
  <text x="460" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Tech: Next.js routes. complete() calls gpt-4o-mini.</text>
  <text x="460" y="844" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Change the provider there. The graphs stay put.</text>

  <rect x="848" y="640" width="390" height="230" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="868" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">3. TOOLS AND MEMORY</text>
  <text x="868" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#12141a">Agents only see what was attached</text>
  <text x="868" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Knowledge is the uploaded text for this project.</text>
  <text x="868" y="748" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Data records are the rows the app keeps.</text>
  <text x="868" y="770" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Connectors are the tools the person named.</text>
  <text x="868" y="792" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">The plan says which evidence is allowed.</text>
  <text x="868" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Tech: knowledge_json, app_records, connectors_json.</text>
  <text x="868" y="844" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">A live tool call still goes through the server proxy.</text>

  <rect x="1256" y="640" width="392" height="230" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="1276" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">4. SANDBOX AND DEPLOY</text>
  <text x="1276" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#12141a">The app runs away from the studio</text>
  <text x="1276" y="726" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Preview HTML is what Soft users click through.</text>
  <text x="1276" y="748" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">The iframe cannot read the studio session cookie.</text>
  <text x="1276" y="770" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Deploy stores that page and serves /a/slug.</text>
  <text x="1276" y="792" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#12141a">Framework files are exported, not executed here.</text>
  <text x="1276" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">Tech: sandboxed iframe. published_apps. Vercel + Neon.</text>
  <text x="1276" y="844" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6472">More apps are more rows, not more servers.</text>

  <rect x="32" y="894" width="1616" height="150" rx="14" fill="#ffffff" stroke="#d5dbe3"/>
  <text x="52" y="924" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#157a45">WHAT COMES BACK</text>
  <text x="52" y="954" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12141a">Soft gets the preview and a public link. They can chat again, and Deploy updates the same link.</text>
  <text x="52" y="980" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12141a">Pro gets that same link, then the files, the traces, an export zip, and a GitHub commit if they connected an account.</text>
  <text x="52" y="1014" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">GitHub path: OAuth popup, token encrypted with AES-256-GCM, Git Data API writes up to 20 files plus preview.html. Soft never enters this path to publish.</text>

  <text x="32" y="1088" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#12141a">Stack: Next.js on Vercel (architect-2-kohl.vercel.app). Neon Postgres. JWT session. bcrypt passwords. OpenAI through the server. GitHub API optional.</text>
  <text x="32" y="1116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6472">Live agents means the harness above, using the project the person already shaped. Soft stays on the app. Pro stays on the same app and can leave with the code.</text>
  <text x="32" y="1164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">Running today: the studio, the project record, the proxy, the sandbox, and Deploy. Build asks the model for the agents, the files, and the page that follow the drawn flow.</text>
  <text x="32" y="1192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">A multi-step live run uses those same records: flow order, agent roles, plan skill, knowledge, and traces. It does not add a second product for Soft or for Pro.</text>
</svg>
